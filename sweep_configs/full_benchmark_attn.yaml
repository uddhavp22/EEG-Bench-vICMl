# Full Benchmark - Compare multiple model sizes across all tasks
#
# Usage: python run_lejepa_sweep.py --config sweep_configs/full_benchmark.yaml
#
# This config runs the full benchmark with multiple model sizes,
# using only the final checkpoint for each model.

models:
  lejepa_base_global_projv2_smallds: #laya -s 
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 4
    
  laya-b-20k-02sig: #laya-b 20k steps with 0.2 sig reg
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/fullds_02sig_20k
    version: 0

checkpoints:
  steps: []
  include_last: true

tasks:
  epoch_sweep: []
  final_only:
    - right_feet
    - left_right_feet_tongue
    - abnormal
    - seizure
    - binary_artifact

training:
  linear_probe: true
  probe_head: attentive
  data_percentages: [1.0]

execution:
  gpus: 1
  workers_per_gpu: 1
  log_dir: rebuttal_logs/lejepa_attn_subset
  results_dir: results_rebuttal/lejepa_attn_subset
