# Performance Over Training - Track how downstream performance changes during pre-training
#
# Usage: python run_lejepa_sweep.py --config sweep_configs/performance_over_training.yaml
#
# This config runs a sweep over training checkpoints on a small subset of tasks
# to analyze how pre-training progress affects downstream performance.

models:
  lejepa_base:
    base_path: /home/spanchavati/eegfm/lightning_logs/lejepa_pretraining_global  # UPDATE THIS PATH
    version: 4

checkpoints:
  # Steps to evaluate - adjust based on your checkpoint availability
  # steps: [1000, 5000, 10000, 25000, 50000]
  include_last: true
  # Alternatively, auto-discover all available checkpoints:
  auto_discover: true

tasks:
  # Only run epoch sweep on these tasks (to save time)
  epoch_sweep:
    # - left_right      # BCI task
    - mtbi      # Clinical task
  # No final_only tasks - we only care about epoch sweep here
  final_only: []

training:
  linear_probe: true  # Freeze encoder
  data_percentages: [1.0]  # Use full training data

execution:
  gpus: 1
  workers_per_gpu: 2
  log_dir: logs/lejepa_perf_over_training
