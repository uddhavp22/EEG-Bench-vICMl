# LeJEPA MLP subset run for selected BCI + clinical tasks.
#
# Usage:
#   python run_lejepa_sweep.py --config sweep_configs/mlp_subset.yaml

models:
  lejepa_base_global_projv2_smallds: #laya -s 
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 4
    
  laya-b-20k-02sig: #laya-b 20k steps with 0.2 sig reg
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/fullds_02sig_20k
    version: 0

checkpoints:
  steps: []
  include_last: true

tasks:
  epoch_sweep: []
  final_only:
    - right_feet
    - left_right_feet_tongue
    - abnormal
    - seizure
    - binary_artifact

training:
  linear_probe: true
  probe_head: mlp
  data_percentages: [1.0]
  seeds: [42, 43, 44]

execution:
  gpus: 1
  workers_per_gpu: 1
  log_dir: rebuttal_logs/lejepa_mlp_subset
  results_dir: results_rebuttal/lejepa_mlp_subset

eval_noise: {}
