# Full Benchmark - Compare multiple model sizes across all tasks
#
# Usage: python run_lejepa_sweep.py --config sweep_configs/full_benchmark.yaml
#
# This config runs the full benchmark with multiple model sizes,
# using only the final checkpoint for each model.

models:
  lejepa_base_global_proj: #technically this is the old version!
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 0
  lejepa_base_global_projv2:
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 2
  lejepa_base_global_projv2_smallds:
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 4
  lejepa_vitb_global_proj: #smaller projector
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_vitb_proj/
    version: 2
  lejepa_vitb_global_proj_v2:
    base_path: /home/spanchavati/eegfmchallenge/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_vitb_proj/
    version: 0
  lejepa_base_global_proj_channelmixerv1_short:
    base_path: /home/spanchavati/eegfmchallenge/lightning_logs/v2_lejepa_pretraining_global_proj/
    version: 0
  lejepa_base_global_proj_channelmixerv1_40K_v2:
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_proj/
    version: 0
  # Add more model sizes as needed:
  # lejepa_large:
  #   base_path: /path/to/your/lejepa_large
  #   version: 0 

checkpoints:
  steps: [10000, 50000]
  include_last: true

tasks:
  epoch_sweep: []
    # - abnormal      # Clinical task
  final_only:
    - all  # Run all 14 tasks

training:
  linear_probe: true
  data_percentages: [1.0] #0.1, 0.25, 0.5, 

execution:
  gpus: 2
  workers_per_gpu: 2
  log_dir: logs/lejepa_full_benchmark

