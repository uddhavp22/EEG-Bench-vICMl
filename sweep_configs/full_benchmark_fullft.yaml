# Full Benchmark - Compare multiple model sizes across all tasks with full fine-tuning
#
# Usage: python run_lejepa_sweep.py --config sweep_configs/full_benchmark_fullft.yaml
#
# This config runs the full benchmark with multiple model sizes with full fine-tuning,
# using only the final checkpoint for each model.

models:
  lejepa_base_global_projv2_smallds: #laya -s  IN FINAL PAPER
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_v2/v2_lejepa_pretraining_global_v2mixer_proj/
    version: 4

  # laya-s-nostopgrad: #laya-s no stopgrad  IN FINAL PAPER
  #   base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/10pct_nostopgrad
  #   version: 2

  laya-mae: #mae  IN FINAL PAPER
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/laya_mae
    version: 0

  laya-b-20k-02sig: #laya-b 20k steps with 0.2 sig reg  IN FINAL PAPER
    base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/fullds_02sig_20k
    version: 0

  # laya-b-20k-02sig-nostopgrad: #no stop grad ablation
  #   base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/fullds_02sig_20k_nostopgrad
  #   version: 4

  laya-mae-raw:
      base_path: /radraid2/spanchavati/eegfm/lightning_logs_rebuttal/laya_mae_raw
      version: 15
  

checkpoints:
  steps: [] #[10000, 20000, 30000]
  include_last: true #usually true

tasks:
  epoch_sweep: #[]
    # - abnormal      # Clinical task
    - all  # Run all 14 tasks
  final_only:
    - all  # Run all 14 tasks

training:
  linear_probe: false
  probe_head: linear #linear probe
  data_percentages: [0.1, 1.0] #, 0.1, 0.25, 0.5]
  seeds: [42, 123, 456] #, 789, 101]

execution:
  gpus: 2
  workers_per_gpu: 1
  log_dir: rebuttal_logs/lejepa_full_benchmark_fullft/rerunning_laya
  results_dir: results_rebuttal/lejepa_full_benchmark_fullft/rerunning_laya

