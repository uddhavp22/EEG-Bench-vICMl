checkpoints:
  steps: [10000, 20000, 30000]
  include_last: true

tasks:
  epoch_sweep: #[]
    # - abnormal      # Clinical task
    - all  # Run all 14 tasks
  final_only:
    - all  # Run all 14 tasks

training:
  linear_probe: true
  data_percentages: [1.0] #, 0.1, 0.25, 0.5]
  seeds: [42, 123, 456, 789, 101]

execution:
  gpus: 1
  workers_per_gpu: 1
  log_dir: final_logs/lejepa_full_benchmark/rerunning_laya
  results_dir: results_new/rerunning_laya

